<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Rooms</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
:root{--line:rgba(255,255,255,.22);--dim:rgba(255,255,255,.62);--glass:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:#fff;font-family:Manrope,system-ui,sans-serif;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
.hidden{display:none!important}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.view{position:relative;z-index:1}
h1,h2{font-family:Unbounded,Manrope,sans-serif;font-weight:700;letter-spacing:-.03em;margin:0}
.sub{color:var(--dim);margin:0}
.solid{background:#fff;color:#000;border:0;border-radius:999px;padding:12px 24px;font-weight:600}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 18px}
.ghost:hover{border-color:#fff}

/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.panel{width:min(400px,100%);background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:32px;display:grid;gap:12px}
.panel h1{font-size:2.4rem;margin-bottom:4px}
.panel label{font-size:.9rem;color:var(--dim)}
.panel input,.panel select{background:#000;border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
.panel input:focus,.panel select:focus{border-color:#fff}

#settings{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.65);padding:20px}
#settings h2{font-size:1.5rem;margin-bottom:6px}
.panel select{color:#fff}
.panel select option{background:#000}
/* lobby */
#lobby{max-width:1120px;margin:0 auto;padding:28px 22px 70px}
.bar{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin-bottom:46px}
.bar span{color:var(--dim)}
#lobby h1{font-size:clamp(2.6rem,9vw,6rem);line-height:.95;margin-bottom:16px}
#lobby .sub{max-width:46ch;margin-bottom:44px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.room{text-align:left;display:flex;flex-direction:column;gap:14px;min-height:200px;padding:22px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;transition:background .25s,color .25s,border-color .25s,transform .1s}
.room .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.room h2{font-size:1.5rem}
.room .chip{color:inherit;opacity:.8}
.pips{display:flex;gap:7px}
.pips i{width:11px;height:11px;border-radius:50%;border:1px solid currentColor;opacity:.8}
.pips i.on{background:currentColor;opacity:1}
.room .who{margin:0;font-size:.9rem;opacity:.65;flex:1;overflow-wrap:anywhere;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);padding-top:12px}
.room .go{align-self:flex-start;border:1px solid currentColor;border-radius:999px;padding:6px 18px;font-weight:600;font-size:.9rem}
.room:hover:not(:disabled),.room:focus-visible{background:#fff;color:#000;border-color:#fff}
.room:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--dim)}

/* button feel */
button{transition:transform .1s,background .2s,border-color .2s}
button:active:not(:disabled){transform:scale(.95)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.92)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
.pop{animation:pop .24s ease-out}

/* call: every piece is its own rounded module */
#call{position:fixed;inset:0;z-index:1;display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr auto;gap:14px;padding:14px}
.mod{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px}
#call header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:12px 18px}
#call header h2{font-size:1.15rem;flex:none}
.stage{overflow:auto;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));grid-auto-rows:minmax(190px,1fr);min-height:0}
.tile{position:relative;background:rgba(0,0,0,.72);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:190px;transition:border-color .15s,box-shadow .15s}
.tile.talking{border-color:#2dff88;box-shadow:0 0 0 2px #2dff88,0 0 26px rgba(45,255,136,.35)}
.tile video{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05)}
.tile.me video{transform:scaleX(-1)}
.avatar{position:absolute;inset:0;display:none;place-items:center;background:#050505}
.tile.nocam .avatar{display:grid}
.avatar b{width:84px;height:84px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 2rem Unbounded,sans-serif}
.tag{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:7px;background:#000;border:1px solid var(--line);font-size:.85rem;padding:4px 12px 4px 9px;border-radius:999px}
.tag svg{width:15px;height:15px;display:block}
.tile.muted .tag{background:#fff;color:#000;border-color:#fff}
.controls{grid-column:1;justify-self:center;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px;border-radius:26px;position:relative;max-width:100%}
.controls .ghost{border-color:transparent}
.controls .ghost:hover{background:rgba(255,255,255,.12)}
.controls .ghost.off{text-decoration:line-through;opacity:.65}
.chat{grid-row:2/4;grid-column:2;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:9px}
.msg{font-size:.92rem;overflow-wrap:anywhere}
.msg b{margin-right:7px}
.msg.sys{color:var(--dim);font-size:.82rem}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat input{flex:1;min-width:0;background:#000;border:1px solid var(--line);border-radius:10px;padding:10px}
.chat .solid{padding:0 16px;border-radius:10px}
.chk{display:flex;gap:10px;align-items:center;color:#fff!important}
.panel .chk input{width:auto}
#topicIn{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 14px;color:var(--dim)}
#topicIn:hover,#topicIn:focus{border-color:var(--line);color:#fff;background:#000}
.room .topic{margin:0;font-size:.95rem;opacity:.85}
.room .topic:empty{display:none}
.pinbtn{position:absolute;top:10px;right:10px;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--line);background:#000;display:grid;place-items:center;opacity:.7}
.pinbtn svg{width:15px;height:15px}
.pinbtn:hover,.pinbtn:focus-visible{opacity:1}
.pinbtn[aria-pressed=true]{background:#fff;color:#000;opacity:1}
.stage.pinned{grid-template-columns:1fr 200px;grid-template-rows:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
.stage.pinned .tile{min-height:0}
.tile.pin{grid-column:1;grid-row:1/span 5}
.tile.sharing video{object-fit:contain;filter:none;transform:none!important;background:#000}
.float{position:absolute;bottom:46px;font-size:2.2rem;pointer-events:none;animation:rise 2.2s ease-out forwards}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1.1)}100%{transform:translateY(-170px) scale(1);opacity:0}}
#reactBar{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;z-index:5}
#reactBar button{background:transparent;border:0;font-size:1.5rem;width:44px;height:44px;border-radius:50%;padding:0}
#reactBar button:hover{background:rgba(255,255,255,.15)}
.typing{min-height:1.4em;padding:0 16px 6px;font-size:.8rem;color:var(--dim)}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:999px;z-index:9;font-weight:600;max-width:90vw}
@media(max-width:760px){
 #call{grid-template-columns:1fr;grid-template-rows:auto 1fr auto 36%}
 #call header{grid-column:1}.chat{grid-row:4;grid-column:1}
 .stage.pinned{grid-template-columns:1fr 104px}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<section id="auth" class="view hidden">
  <form id="authForm" class="panel">
    <h1>Ten rooms</h1>
    <p class="sub">Pick a name and walk into any open room.</p>
    <label for="u">Your name</label><input id="u" maxlength="20" autocomplete="nickname" placeholder="e.g. Sam" required>
    <button class="solid" id="authGo">Enter</button>
  </form>
</section>

<main id="lobby" class="view hidden">
  <div class="bar"><span id="me"></span><button class="ghost" id="openSet">Settings</button><button class="ghost" id="logout">Change name</button></div>
  <h1>Ten rooms</h1>
  <p class="sub">Walk into any open room to talk on video. Every room has its own chat.</p>
  <div class="rooms" id="rooms"></div>
</main>

<section id="call" class="hidden">
  <header class="mod"><h2 id="roomTitle"></h2><input id="topicIn" maxlength="40" placeholder="Add a topic" aria-label="Room topic" autocomplete="off"><span id="roomCount" class="chip"></span></header>
  <div class="stage" id="stage"></div>
  <div class="controls mod">
    <button class="ghost" id="mic" data-sfx="none">Mute mic</button>
    <button class="ghost" id="cam" data-sfx="none">Stop camera</button>
    <button class="ghost" id="share">Share screen</button>
    <button class="ghost" id="react">React</button>
    <button class="ghost" id="openSet2">Settings</button>
    <button class="solid" id="leave">Leave room</button>
    <div id="reactBar" class="mod hidden" role="group" aria-label="Reactions"></div>
  </div>
  <aside class="chat mod">
    <div id="log" aria-live="polite"></div>
    <div id="typing" class="typing" aria-live="polite"></div>
    <form id="chatForm"><input id="chatText" maxlength="500" placeholder="Message this room" autocomplete="off"><button class="solid">Send</button></form>
  </aside>
</section>

<div id="settings" class="hidden">
  <div class="panel" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <label for="selCam">Camera</label><select id="selCam"></select>
    <label for="selMic">Microphone</label><select id="selMic"></select>
    <div id="spkRow" style="display:grid;gap:12px"><label for="selSpk">Speakers</label><select id="selSpk"></select></div>
    <label class="chk"><input type="checkbox" id="selSfx"> Interface sounds</label>
    <button class="solid" id="setDone">Done</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws, ICE = [], myName = '', rooms = [], local = null, peers = {}, inRoom = false;

/* ---------- floating dot web (always running; slower if reduced motion is on) ---------- */
(() => {
  const cv = $('bg'), cx = cv.getContext('2d'), D = 150, mouse = { x: -999, y: -999 };
  const speed = matchMedia('(prefers-reduced-motion: reduce)').matches ? .25 : 1;
  let W, H, dots = [];
  function size() {
    const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight;
    cv.width = W * r; cv.height = H * r; cx.setTransform(r, 0, 0, r, 0, 0);
    const n = Math.min(150, Math.floor(W * H / 11000));
    while (dots.length < n) dots.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: Math.random() * 1.4 + .7 });
    dots.length = n;
  }
  addEventListener('resize', size); addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('mouseout', () => mouse.x = -999);
  size();
  (function tick() {
    cx.clearRect(0, 0, W, H);
    for (const p of dots) {
      p.x += p.vx * speed; p.y += p.vy * speed;
      if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    cx.lineWidth = 1;
    for (let i = 0; i < dots.length; i++) {
      const a = dots[i];
      for (let j = i + 1; j < dots.length; j++) {
        const b = dots[j], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < D) { cx.strokeStyle = `rgba(255,255,255,${(1 - d / D) * .38})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
      }
      const m = Math.hypot(a.x - mouse.x, a.y - mouse.y);
      if (m < 190) { cx.strokeStyle = `rgba(255,255,255,${(1 - m / 190) * .6})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(mouse.x, mouse.y); cx.stroke(); }
      cx.fillStyle = 'rgba(255,255,255,.85)'; cx.beginPath(); cx.arc(a.x, a.y, a.r, 0, 6.283); cx.fill();
    }
    requestAnimationFrame(tick);
  })();
})();

/* ---------- views + name ---------- */
function show(v) { ['auth', 'lobby', 'call'].forEach(x => $(x).classList.toggle('hidden', x !== v)); }
$('authForm').onsubmit = e => {
  e.preventDefault();
  const n = $('u').value.trim(); if (!n) return;
  localStorage.setItem('name', n); connect();
};
$('logout').onclick = () => { if (ws) ws.close(1000); exitRoom(); $('u').value = localStorage.getItem('name') || ''; show('auth'); };

function connect() {
  const n = localStorage.getItem('name'); if (!n) return show('auth');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?name=' + encodeURIComponent(n));
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = e => {
    if (inRoom) exitRoom();
    if (e.code === 1000) return;
    toast('Connection lost. Reconnecting…'); setTimeout(connect, 2000);
  };
}
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

function handle(m) {
  if (m.type === 'hello') { myName = m.name; ICE = m.ice; rooms = m.rooms; $('me').textContent = 'You are ' + myName; drawLobby(); show('lobby'); }
  else if (m.type === 'lobby') { rooms = m.rooms; drawLobby(); }
  else if (m.type === 'error') toast(m.text);
  else if (m.type === 'joined') onJoined(m);
  else if (m.type === 'peer-joined') { addTile(m.id, m.name, null, false, m); updateCount(); sfx.join(); }
  else if (m.type === 'peer-left') { dropPeer(m.id); sfx.leave(); }
  else if (m.type === 'state') setState(m.id, m);
  else if (m.type === 'react') { floatEmoji(m.id, m.emoji); tone(700, .08, 'sine', .04, 1.5); }
  else if (m.type === 'typing') setTyper(m.id, m.name, m.on);
  else if (m.type === 'topic') { if (document.activeElement !== $('topicIn')) $('topicIn').value = m.text; }
  else if (m.type === 'signal') onSignal(m.from, m.data);
  else if (m.type === 'chat') { addMsg(m.msg); if (!m.msg.system) { Object.keys(typers).forEach(k => { if (typers[k].name === m.msg.name) setTyper(k, '', false); }); if (m.msg.name !== myName) sfx.msg(); } }
}

/* ---------- lobby ---------- */
function drawLobby() {
  const box = $('rooms'); box.innerHTML = '';
  rooms.forEach(r => {
    const n = r.users.length, full = n >= r.max, b = document.createElement('button');
    b.className = 'room'; b.disabled = full;
    b.innerHTML = '<div class="top"><h2></h2><span class="chip"></span></div><p class="topic"></p><div class="pips"></div><p class="who"></p><span class="go"></span>';
    b.querySelector('h2').textContent = r.name; b.querySelector('.chip').textContent = n + '/' + r.max; b.querySelector('.topic').textContent = r.topic || '';
    const pips = b.querySelector('.pips');
    for (let i = 0; i < r.max; i++) { const s = document.createElement('i'); if (i < n) s.className = 'on'; pips.appendChild(s); }
    b.querySelector('.who').textContent = n ? n + ' inside: ' + r.users.join(', ') : 'Empty. Be the first in.';
    b.querySelector('.go').textContent = full ? 'Full' : 'Enter';
    b.onclick = () => joinRoom(r.id);
    box.appendChild(b);
  });
}

/* ---------- calls ---------- */
async function joinRoom(id) {
  try { local = await navigator.mediaDevices.getUserMedia(constraints()); }
  catch {
    try { local = await navigator.mediaDevices.getUserMedia({ audio: constraints().audio }); toast('No camera found: joining with audio only'); }
    catch { local = null; toast('No mic or camera: joining as a viewer'); }
  }
  send({ type: 'join', room: id });
}
function onJoined(m) {
  inRoom = true; show('call');
  $('roomTitle').textContent = m.name; $('stage').innerHTML = ''; $('log').innerHTML = '';
  m.chat.forEach(addMsg);
  addTile('me', myName, local, true);
  updateBtns(); pin(null); $('topicIn').value = m.topic || '';
  // the newcomer sends offers to everyone already inside
  m.peers.forEach(p => { addTile(p.id, p.name, null, false, p); call(p.id); });
  meter('me', local); pushState();
  updateCount();
}
function updateCount() {
  const n = Object.keys(peers).length + 1; $('roomCount').textContent = n + (n === 1 ? ' person' : ' people');
}
function addTile(id, name, stream, mine, state) {
  let t = $('t-' + id);
  if (!t) {
    t = document.createElement('div'); t.id = 't-' + id; t.className = 'tile' + (mine ? ' me' : '');
    t.innerHTML = '<video autoplay playsinline></video><div class="avatar"><b></b></div><div class="tag"><i class="ic"></i><span></span></div><button type="button" class="pinbtn" aria-label="Pin" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg></button>';
    t.querySelector('.pinbtn').onclick = () => pin(pinId === id ? null : id);
    t.querySelector('.avatar b').textContent = (name[0] || '?').toUpperCase();
    if (mine) t.querySelector('video').muted = true;
    $('stage').appendChild(t);
    if (!mine) applySink(t.querySelector('video'));
  }
  t.querySelector('span').textContent = mine ? name + ' (you)' : name;
  if (stream) t.querySelector('video').srcObject = stream;
  setState(id, state || { muted: false, camOff: false });
}
function makePC(id) {
  const pc = new RTCPeerConnection({ iceServers: ICE }); peers[id] = pc;
  if (local) local.getTracks().forEach(t => pc.addTrack(t, local));
  // always negotiate both kinds as send+receive, so a camera, mic or screen can be added later without renegotiating
  ['audio', 'video'].forEach(k => { if (!local || !local.getTracks().some(t => t.kind === k)) pc.addTransceiver(k, { direction: 'sendrecv' }); });
  pc.remote = new MediaStream();
  pc.onicecandidate = e => e.candidate && send({ type: 'signal', to: id, data: { candidate: e.candidate } });
  pc.ontrack = e => { pc.remote.addTrack(e.track); const t = $('t-' + id); if (t) t.querySelector('video').srcObject = pc.remote; if (e.track.kind === 'audio') meter(id, pc.remote); };
  return pc;
}
async function call(id) {
  const pc = makePC(id);
  await pc.setLocalDescription(await pc.createOffer());
  send({ type: 'signal', to: id, data: { sdp: pc.localDescription } });
}
async function onSignal(from, d) {
  try {
    if (d.sdp && d.sdp.type === 'offer') {
      if (!$('t-' + from)) addTile(from, 'Guest');
      const pc = peers[from] || makePC(from);
      await pc.setRemoteDescription(d.sdp);
      await pc.setLocalDescription(await pc.createAnswer());
      send({ type: 'signal', to: from, data: { sdp: pc.localDescription } });
    } else if (d.sdp && peers[from]) await peers[from].setRemoteDescription(d.sdp);
    else if (d.candidate && peers[from]) await peers[from].addIceCandidate(d.candidate);
  } catch (err) { console.warn('signal error', err); }
}
function dropPeer(id) {
  unmeter(id); setTyper(id, '', false); if (pinId === id) pin(null);
  if (peers[id]) { peers[id].close(); delete peers[id]; }
  const t = $('t-' + id); if (t) t.remove();
  updateCount();
}
function exitRoom() {
  inRoom = false; Object.keys(peers).forEach(dropPeer); unmeter('me'); sharing = null; $('share').textContent = 'Share screen'; pin(null); Object.keys(typers).forEach(k => setTyper(k, '', false));
  if (local) local.getTracks().forEach(t => t.stop());
  local = null; $('mic').textContent = 'Mute mic'; $('cam').textContent = 'Stop camera';
  $('mic').classList.remove('off'); $('cam').classList.remove('off');
  if (!$('auth').classList.contains('hidden')) return;
  show('lobby');
}
$('leave').onclick = () => { send({ type: 'leave' }); exitRoom(); };
function toggle(btn, kind, on, off) {
  btn.onclick = () => {
    const tr = kind === 'a' ? local.getAudioTracks() : local.getVideoTracks();
    const v = !tr[0].enabled; tr.forEach(t => t.enabled = v);
    btn.textContent = v ? on : off; btn.classList.toggle('off', !v);
    pushState(); (v ? sfx.on : sfx.off)();
  };
}
toggle($('mic'), 'a', 'Mute mic', 'Unmute mic'); toggle($('cam'), 'v', 'Stop camera', 'Start camera');

/* ---------- device settings ---------- */
const prefs = (() => { try { return JSON.parse(localStorage.getItem('devs')) || {}; } catch { return {}; } })();
const savePrefs = () => localStorage.setItem('devs', JSON.stringify(prefs));
const constraints = () => ({
  video: prefs.cam ? { deviceId: { ideal: prefs.cam } } : true,
  audio: prefs.mic ? { deviceId: { ideal: prefs.mic }, echoCancellation: true, noiseSuppression: true } : true
});
const canSink = 'setSinkId' in HTMLMediaElement.prototype;
function applySink(v) { if (canSink && prefs.spk) v.setSinkId(prefs.spk).catch(() => {}); }

async function fillDevices() {
  let list = await navigator.mediaDevices.enumerateDevices();
  if (!list.some(d => d.label)) { // names stay hidden until the browser has granted camera/mic access once
    let t = null;
    try { t = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); }
    catch { try { t = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch {} }
    if (t) t.getTracks().forEach(x => x.stop());
    list = await navigator.mediaDevices.enumerateDevices();
  }
  const cur = k => local && (k === 'videoinput' ? local.getVideoTracks() : local.getAudioTracks())[0]?.getSettings().deviceId;
  const fill = (sel, kind, saved) => {
    const items = list.filter(d => d.kind === kind); sel.innerHTML = '';
    if (!items.length) { sel.add(new Option('None found', '')); sel.disabled = true; return; }
    sel.disabled = false;
    items.forEach((d, i) => sel.add(new Option(d.label || kind.replace('input', '') + ' ' + (i + 1), d.deviceId)));
    const want = saved || cur(kind); if (want && items.some(d => d.deviceId === want)) sel.value = want;
  };
  fill($('selCam'), 'videoinput', prefs.cam); fill($('selMic'), 'audioinput', prefs.mic);
  $('spkRow').style.display = canSink ? 'grid' : 'none';
  if (canSink) fill($('selSpk'), 'audiooutput', prefs.spk);
}
async function openSettings() {
  $('selSfx').checked = sfxOn; $('settings').classList.remove('hidden'); await fillDevices(); $('selCam').focus(); }
const closeSettings = () => $('settings').classList.add('hidden');
$('openSet').onclick = $('openSet2').onclick = openSettings; $('setDone').onclick = closeSettings;
$('settings').onclick = e => { if (e.target === $('settings')) closeSettings(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });
navigator.mediaDevices?.addEventListener?.('devicechange', () => { if (!$('settings').classList.contains('hidden')) fillDevices(); });

async function switchDevice(kind, id) { // swap the live camera or mic without leaving the room
  prefs[kind] = id; savePrefs();
  const vid = kind === 'cam';
  if (!local || !id || (vid && sharing)) return; // while sharing, the camera choice applies when sharing stops
  let s;
  try { s = await navigator.mediaDevices.getUserMedia(vid ? { video: { deviceId: { exact: id } } } : { audio: { deviceId: { exact: id }, echoCancellation: true, noiseSuppression: true } }); }
  catch { return toast('Could not switch to that device'); }
  swapTrack(s.getTracks()[0]); pushState();
}
$('selSfx').onchange = () => { sfxOn = $('selSfx').checked; localStorage.setItem('sfx', sfxOn ? 'on' : 'off'); if (sfxOn) sfx.pop(); };
$('selCam').onchange = () => switchDevice('cam', $('selCam').value);
$('selMic').onchange = () => switchDevice('mic', $('selMic').value);
$('selSpk').onchange = () => { prefs.spk = $('selSpk').value; savePrefs(); document.querySelectorAll('.tile:not(.me) video').forEach(applySink); };

/* ---------- mic icons, talking outline ---------- */
const IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const MIC = IC + '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const MICOFF = IC + '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg>';
function setState(id, s) {
  const t = $('t-' + id); if (!t) return;
  t.classList.toggle('muted', !!s.muted); t.classList.toggle('nocam', !!s.camOff && !s.sharing); t.classList.toggle('sharing', !!s.sharing);
  t.querySelector('.ic').innerHTML = s.muted ? MICOFF : MIC;
  if (s.muted) t.classList.remove('talking');
  if (id !== 'me') { if (s.sharing && !pinId) pin(id, true); else if (!s.sharing && autoPin === id) pin(null); } // auto-spotlight a screen share
}
function pushState() {
  const a = local && local.getAudioTracks()[0], v = local && local.getVideoTracks()[0];
  const st = { muted: !a || !a.enabled, camOff: !v || !v.enabled, sharing: !!sharing };
  setState('me', st); send({ type: 'state', ...st });
}
let actx; const meters = {};
function ctx() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
function meter(id, stream) {
  unmeter(id);
  if (!stream || !stream.getAudioTracks().length) return;
  try {
    const c = ctx(), src = c.createMediaStreamSource(stream), an = c.createAnalyser(); an.fftSize = 512; src.connect(an);
    meters[id] = { an, src, buf: new Uint8Array(an.fftSize), hold: 0 };
  } catch {}
}
function unmeter(id) { const m = meters[id]; if (m) { try { m.src.disconnect(); } catch {} delete meters[id]; } }
setInterval(() => {
  const now = Date.now();
  for (const id in meters) {
    const m = meters[id]; m.an.getByteTimeDomainData(m.buf);
    let peak = 0; for (const v of m.buf) peak = Math.max(peak, Math.abs(v - 128));
    if (peak > 10) m.hold = now + 350;
    const t = $('t-' + id); if (t) t.classList.toggle('talking', now < m.hold && !t.classList.contains('muted'));
  }
}, 90);

/* ---------- sounds (synthesized, no files) ---------- */
let sfxOn = localStorage.getItem('sfx') !== 'off';
function tone(f, d, type, vol, slide, delay) {
  if (!sfxOn) return;
  try {
    const c = ctx(), o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (delay || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d);
  } catch {}
}
const sfx = {
  click: () => tone(1200, .05, 'square', .03, .6),
  pop: () => tone(420, .12, 'sine', .12, 2.2),
  on: () => { tone(520, .08, 'sine', .09); tone(780, .1, 'sine', .09, 1, .07); },
  off: () => { tone(780, .08, 'sine', .09); tone(520, .1, 'sine', .09, 1, .07); },
  join: () => { tone(523, .1, 'triangle', .08); tone(784, .14, 'triangle', .08, 1, .09); },
  leave: () => { tone(659, .1, 'triangle', .08); tone(440, .16, 'triangle', .08, 1, .09); },
  msg: () => tone(900, .07, 'sine', .05, 1.4)
};
document.addEventListener('click', e => { // every button: pop animation + sound
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  b.addEventListener('animationend', () => b.classList.remove('pop'), { once: true });
  if (b.dataset.sfx !== 'none') (b.classList.contains('solid') || b.classList.contains('room') ? sfx.pop : sfx.click)();
});

/* ---------- swapping tracks, screen share ---------- */
let sharing = null, hadCam = false, camWasOn = true;
function updateBtns() {
  $('mic').disabled = !local || !local.getAudioTracks().length;
  $('cam').disabled = !local || !local.getVideoTracks().length || !!sharing;
}
function swapTrack(nt) { // replace our track of that kind, live for every peer
  const k = nt.kind; local = local || new MediaStream();
  const old = local.getTracks().find(t => t.kind === k);
  if (old) { nt.enabled = old.enabled; local.removeTrack(old); old.stop(); }
  local.addTrack(nt);
  Object.values(peers).forEach(pc => { const t = pc.getTransceivers().find(x => x.receiver.track.kind === k); if (t) t.sender.replaceTrack(nt); });
  const me = $('t-me'); if (me) me.querySelector('video').srcObject = local;
  if (k === 'audio') meter('me', local);
  updateBtns();
}
function dropVideo() {
  const old = local && local.getVideoTracks()[0]; if (old) { local.removeTrack(old); old.stop(); }
  Object.values(peers).forEach(pc => { const t = pc.getTransceivers().find(x => x.receiver.track.kind === 'video'); if (t) t.sender.replaceTrack(null); });
  const me = $('t-me'); if (me && local) me.querySelector('video').srcObject = local;
}
async function toggleShare() {
  if (sharing) return stopShare();
  if (!navigator.mediaDevices.getDisplayMedia) return toast('Screen sharing is not supported on this device');
  let ds; try { ds = await navigator.mediaDevices.getDisplayMedia({ video: true }); } catch { return; }
  const old = local && local.getVideoTracks()[0]; hadCam = !!old; camWasOn = !!old && old.enabled;
  const nt = ds.getVideoTracks()[0]; nt.onended = stopShare; sharing = ds;
  swapTrack(nt); nt.enabled = true; $('share').textContent = 'Stop sharing'; pushState();
}
async function stopShare() {
  if (!sharing) return;
  const ds = sharing; sharing = null; ds.getTracks().forEach(t => t.stop()); $('share').textContent = 'Share screen';
  let cam = null;
  if (hadCam) { try { cam = (await navigator.mediaDevices.getUserMedia({ video: prefs.cam ? { deviceId: { ideal: prefs.cam } } : true })).getVideoTracks()[0]; } catch {} }
  if (cam) { swapTrack(cam); cam.enabled = camWasOn; } else dropVideo();
  updateBtns(); pushState();
}
$('share').onclick = toggleShare;

/* ---------- pinning ---------- */
let pinId = null, autoPin = null;
function pin(id, auto) {
  pinId = id || null; autoPin = id && auto ? id : null;
  $('stage').classList.toggle('pinned', !!pinId);
  document.querySelectorAll('.tile').forEach(t => {
    const on = !!pinId && t.id === 't-' + pinId; t.classList.toggle('pin', on);
    t.querySelector('.pinbtn').setAttribute('aria-pressed', on);
  });
}

/* ---------- reactions ---------- */
function floatEmoji(id, e) {
  const t = $('t-' + id); if (!t) return;
  const f = document.createElement('span'); f.className = 'float'; f.textContent = e; f.style.left = (12 + Math.random() * 60) + '%';
  t.appendChild(f); setTimeout(() => f.remove(), 2300);
}
const reactBar = $('reactBar');
['👍', '😂', '🎉', '👏', '🔥', '💜'].forEach(e => {
  const b = document.createElement('button'); b.textContent = e; b.dataset.sfx = 'none'; b.setAttribute('aria-label', 'React ' + e);
  b.onclick = () => { send({ type: 'react', emoji: e }); floatEmoji('me', e); reactBar.classList.add('hidden'); sfx.pop(); };
  reactBar.appendChild(b);
});
$('react').onclick = () => reactBar.classList.toggle('hidden');
document.addEventListener('click', e => { if (!reactBar.contains(e.target) && e.target.id !== 'react') reactBar.classList.add('hidden'); });

/* ---------- typing indicator + topic ---------- */
const typers = {}; let typingSent = 0, typingTimer;
function setTyper(id, name, on) {
  if (typers[id]) clearTimeout(typers[id].t);
  if (on) typers[id] = { name, t: setTimeout(() => { delete typers[id]; showTyping(); }, 3500) }; else delete typers[id];
  showTyping();
}
function showTyping() {
  const n = Object.values(typers).map(x => x.name);
  $('typing').textContent = !n.length ? '' : n.length === 1 ? n[0] + ' is typing…' : n.length === 2 ? n[0] + ' and ' + n[1] + ' are typing…' : n.length + ' people are typing…';
}
$('chatText').addEventListener('input', () => {
  const now = Date.now(); if (now - typingSent > 2000) { typingSent = now; send({ type: 'typing', on: true }); }
  clearTimeout(typingTimer); typingTimer = setTimeout(() => { typingSent = 0; send({ type: 'typing', on: false }); }, 2500);
});
$('topicIn').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('topicIn').addEventListener('change', () => send({ type: 'topic', text: $('topicIn').value }));

/* ---------- chat ---------- */
function addMsg(m) {
  const d = document.createElement('div'); d.className = 'msg' + (m.system ? ' sys' : '');
  if (m.system) d.textContent = m.text; else { const b = document.createElement('b'); b.textContent = m.name; d.append(b, m.text); }
  const log = $('log'); log.appendChild(d); log.scrollTop = log.scrollHeight;
}
$('chatForm').onsubmit = e => { e.preventDefault(); const v = $('chatText').value.trim(); if (v) send({ type: 'chat', text: v }); $('chatText').value = ''; clearTimeout(typingTimer); typingSent = 0; send({ type: 'typing', on: false }); };
function toast(t) {
  const old = $('toast'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
}
connect();
</script>
